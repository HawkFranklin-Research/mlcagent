id: score_validation
event: validate
title: Score candidates on validation rows
params: {}
prompt: 'Do: Mean squared reconstruction error. Choose the lowest validation reconstruction
  error; never train a supervised probe in this project. For the autoencoder save
  a complete reconstructing pipeline and extract its bottleneck activations without
  fitting again. Score only val; do not fit. Freeze the validation-selected candidate
  before test.

  Save: validation_metrics.csv (model, metric, value).

  Record: metric reconstruction_error on val; fact best_validation_score (source validation_metrics.csv).'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
outputs:
- name: validation_metrics.csv
  kind: table
  required: true
fact_candidates:
- best_model
- best_validation_score
reads_test: false
timeout_s: 300
methods_text: 'Score candidates on validation rows: Mean squared reconstruction error.
  Choose the lowest validation reconstruction error; never train a supervised probe
  in this project. For the autoencoder save a complete reconstructing pipeline and
  extract its bottleneck activations without fitting again. Score only val; do not
  fit. Freeze the validation-selected candidate before test.'
builtin: null
