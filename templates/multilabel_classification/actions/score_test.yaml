id: score_test
event: test
title: Score the frozen model on test rows
params: {}
prompt: 'Do: Per-label macro F1, joint Hamming loss and subset accuracy; encode each
  categorical label consistently using training-fitted encoders. Choose highest macro
  F1. Score only test; do not fit. Freeze the validation-selected candidate before
  test.

  Save: test_metrics.csv (model, metric, value).

  Record: metric macro_f1 on test; fact test_score (source test_metrics.csv).'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
- ref: test
outputs:
- name: test_metrics.csv
  kind: table
  required: true
fact_candidates:
- test_score
reads_test: true
timeout_s: 300
methods_text: Follow the recorded task and saved model contract; all fitting uses
  training rows only.
builtin: null
