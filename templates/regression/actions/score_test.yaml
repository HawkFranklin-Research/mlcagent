id: score_test
event: test
title: Score the frozen model on test rows
params: {}
prompt: 'Do: RMSE, MAE and R2 per target and macro average; use actual targets from
  _protocol. Choose the lowest validation primary metric. Record any primary-metric
  change with its reason. Score only test; do not fit. Freeze the validation-selected
  candidate before test.

  Save: test_metrics.csv (model, metric, value).

  Record: metric rmse on test; fact test_score (source test_metrics.csv).'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
- ref: test
outputs:
- name: test_metrics.csv
  kind: table
  required: true
fact_candidates:
- test_score
reads_test: true
timeout_s: 300
methods_text: Follow the recorded task and saved model contract; all fitting uses
  training rows only.
builtin: null
