id: score_validation
event: validate
title: Score candidates on validation rows
params: {}
prompt: 'Do: RMSE, MAE and R2 per target and macro average; use actual targets from
  _protocol. Choose the lowest validation primary metric. Record any primary-metric
  change with its reason. Score only val; do not fit. Freeze the validation-selected
  candidate before test.

  Save: validation_metrics.csv (model, metric, value).

  Record: metric rmse on val; fact best_validation_score (source validation_metrics.csv).'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
outputs:
- name: validation_metrics.csv
  kind: table
  required: true
fact_candidates:
- best_model
- best_validation_score
reads_test: false
timeout_s: 300
methods_text: Follow the recorded task and saved model contract; all fitting uses
  training rows only.
builtin: null
