# DRAFT – author to finalise
id: freeze_stratified
event: split
title: Freeze seeded split
params:
  method:
    type: enum
    enum:
    - stratified
    - random
    - group
    - time
    default: stratified
  train_fraction:
    type: number
    default: 0.6
    minimum: 0.1
    maximum: 0.9
  val_fraction:
    type: number
    default: 0.2
    minimum: 0.05
    maximum: 0.8
  seed:
    type: integer
    default: 42
  group_column:
    type: string
    default: ''
    required: false
  time_column:
    type: string
    default: ''
    required: false
prompt: 'Freeze seeded split. Target and study context are in the supplied brief.
  Read declared inputs using mlca_runtime.inputs(). Save the required output split.json.
  Use mlca_runtime save_table, save_figure and record_metric for evidence. Do not
  send data, install packages, access undeclared paths or use the test set outside
  its event. '
inputs:
- ref: registered_data
outputs:
- name: split.json
  kind: report
  required: true
fact_candidates: []
reads_test: false
timeout_s: 300
methods_text: Freeze seeded split.
builtin: split
