# Content v0.2.0 (2026-10-06). Keep it short: see docs/templates.md, 'Writing content'.
id: tabular_classification
version: 0.2.0
title: Tabular Classification
description: 'Binary or multiclass classification from one table. Baseline: regularised logistic regression; one
  prespecified alternative (gradient boosting). Primary metric: ROC AUC (macro one-vs-rest if multiclass), chosen
  on validation, confirmed once on test.'
brief_questions:
- id: aim
  text: 'Aim in one sentence: what is predicted, for whom, and why?'
- id: target
  text: Target column (exact name).
- id: unit
  text: What is one row (patient, sample, visit)? Can a subject have several rows?
events:
- onboard
- data
- eda
- split
- preprocess
- features
- model
- validate
- test
- interpret
- report
transitions:
  loops:
  - from: validate
    to:
    - preprocess
    - features
    - model
  goto: []
style: default
default_runtime_packages:
- numpy
- pandas
- scipy
- scikit-learn
- matplotlib
- seaborn
- pyarrow
