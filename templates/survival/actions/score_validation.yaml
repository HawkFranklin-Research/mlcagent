# Content v0.2.0 (2026-10-06). Keep it short: see docs/templates.md, 'Writing content'.
id: score_validation
event: validate
title: Score candidates on validation rows
params: {}
prompt: |
  Do: for each saved candidate: Harrell's C-index; check proportional hazards (Schoenfeld test, p per covariate) for the baseline.
  Save: validation_metrics.csv (model, metric, value).
  Record: metric c_index on val for each model; facts best_model, best_val_c_index (source validation_metrics.csv).
inputs:
- ref: train
- ref: val
- ref: prior_outputs
outputs:
- name: validation_metrics.csv
  kind: table
  required: true
fact_candidates:
- best_model
- best_val_c_index
reads_test: false
timeout_s: 300
methods_text: Candidates were compared on validation rows by Harrell's C-index.
builtin: null
