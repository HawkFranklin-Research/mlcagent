# Content v0.2.0 (2026-10-06). Keep it short: see docs/templates.md, 'Writing content'.
id: survival
version: 0.2.0
title: Survival
description: 'Time-to-event analysis from one table with a duration and an event indicator. Baseline: Cox proportional
  hazards; one prespecified alternative (penalised Cox). Primary metric: Harrell''s C-index, chosen on validation,
  confirmed once on test.'
brief_questions:
- id: aim
  text: 'Aim in one sentence: which outcome, in whom, and why?'
- id: target
  text: Duration column (exact name; time to event or censoring).
- id: unit
  text: What is one row (patient, sample)? Can a subject have several rows?
- id: event_column
  text: Event column (exact name; 1 = event observed, 0 = censored).
events:
- onboard
- data
- eda
- split
- preprocess
- features
- model
- validate
- test
- interpret
- report
transitions:
  loops:
  - from: validate
    to:
    - preprocess
    - features
    - model
  goto: []
style: default
default_runtime_packages:
- numpy
- pandas
- scipy
- scikit-learn
- matplotlib
- seaborn
- pyarrow
- lifelines
