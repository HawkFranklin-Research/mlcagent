id: score_validation
event: validate
title: Score candidates on validation rows
params: {}
prompt: 'Do: Compute Silhouette, Calinski-Harabasz and Davies-Bouldin with saved candidates.
  Reuse training stability computed during Model; never refit resamples here. No
  labels exist in this project. Score only val; do not fit. Freeze
  the validation-selected candidate before test.

  Save: validation_metrics.csv (model, metric, value).

  Record: metric silhouette on val; fact best_validation_score (source validation_metrics.csv).'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
outputs:
- name: validation_metrics.csv
  kind: table
  required: true
fact_candidates:
- best_model
- best_validation_score
reads_test: false
timeout_s: 300
methods_text: Follow the recorded task and saved model contract; all fitting uses
  training rows only.
builtin: null
