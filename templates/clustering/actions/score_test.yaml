id: score_test
event: test
title: Score the frozen model on test rows
params: {}
prompt: 'Do: Compute Silhouette, Calinski-Harabasz and Davies-Bouldin with saved candidates.
  Reuse training stability computed during Model; never refit resamples here. No
  labels exist in this project. Score only test; do not fit. Freeze
  the validation-selected candidate before test.

  Save: test_metrics.csv (model, metric, value).

  Record: metric silhouette on test; fact test_score (source test_metrics.csv).

  Save: assignments.parquet, one row per training and test source row; row_id = original
  DataFrame index, partition = train/test, and cluster assignment. Use save_row_outputs.
  These are local-only evaluator artifacts; never expose them to an LLM.'
inputs:
- ref: train
- ref: val
- ref: prior_outputs
- ref: test
outputs:
- name: test_metrics.csv
  kind: table
  required: true
- name: assignments.parquet
  kind: data
  required: true
fact_candidates:
- test_score
reads_test: true
timeout_s: 300
methods_text: Follow the recorded task and saved model contract; all fitting uses
  training rows only.
builtin: null
