  text: '```python

    import pickle, pandas as pd, mlca_runtime as m

    from sklearn.metrics import roc_auc_score

    i = m.inputs(); te = pd.read_parquet(i["test"])

    model = pickle.load(open(i["latest_model"], "rb"))

    auc = roc_auc_score(te["y"], model.predict_proba(te.drop(columns="y"))[:, 1])

    m.record_metric("roc_auc", auc, "test")

    m.save_table(pd.DataFrame({"metric": ["roc_auc"], "value": [auc]}), "test_metrics.csv")

    ```

