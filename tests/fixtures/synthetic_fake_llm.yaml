- match:
    role: worker
    action_id: fit_preprocessing
  text: '```python

    import pandas as pd, mlca_runtime as m

    from sklearn.preprocessing import StandardScaler

    tr = pd.read_parquet(m.inputs()["train"])

    X = tr.drop(columns="y")

    sc = m.fit_record(StandardScaler(), X, "train")

    m.save_model(sc, "preprocessor.pkl")

    ```

