  text: '```python

    import pandas as pd, mlca_runtime as m

    df = pd.read_csv(list(m.inputs().values())[0])

    s = pd.DataFrame({"column": df.columns, "dtype": df.dtypes.astype(str).values,
    "missing": df.isna().sum().values})

    m.save_table(s, "schema.json")

