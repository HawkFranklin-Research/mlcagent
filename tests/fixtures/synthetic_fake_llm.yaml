- match:
    role: worker
    action_id: select_features
  text: '```python

    import pandas as pd, mlca_runtime as m

    from sklearn.feature_selection import SelectKBest

    tr = pd.read_parquet(m.inputs()["train"])

    sel = m.fit_record(SelectKBest(k=2), tr.drop(columns="y"), "train", y=tr["y"])

    m.save_model(sel, "selector.pkl")

    ```

    '
- match:
    role: worker
    action_id: train_logistic
  text: '```python

    import pandas as pd, mlca_runtime as m

    from sklearn.pipeline import make_pipeline

    from sklearn.preprocessing import StandardScaler

    from sklearn.linear_model import LogisticRegression

    tr = pd.read_parquet(m.inputs()["train"])

    pipe = m.fit_record(make_pipeline(StandardScaler(), LogisticRegression()), tr.drop(columns="y"),
    "train", y=tr["y"])

    m.save_model(pipe, "model.pkl")

    ```

    '
- match:
    role: worker
    action_id: score_validation
  text: '```python

    import pickle, pandas as pd, mlca_runtime as m

    from sklearn.metrics import roc_auc_score

    i = m.inputs(); va = pd.read_parquet(i["val"])

    model = pickle.load(open(i["latest_model"], "rb"))

    auc = roc_auc_score(va["y"], model.predict_proba(va.drop(columns="y"))[:, 1])

    m.record_metric("roc_auc", auc, "val")

    m.save_table(pd.DataFrame({"metric": ["roc_auc"], "value": [auc]}), "validation_metrics.csv")

    ```

    '
