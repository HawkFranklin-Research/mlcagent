name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUFF_CACHE_DIR: ${{ runner.temp }}/mlca-ruff
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux namespace dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync --locked --group dev
      - name: Format and lint
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check
      - name: Prime external analysis dependency cache
        run: uv run python scripts/prime_test_cache.py
      - name: Verify generated wrapper metadata
        run: uv run python scripts/sync_versions.py --check
      - name: Offline suite including slow tests
        env:
          UV_OFFLINE: '1'
        run: uv run pytest -q
      - name: Wheel resources
        env:
          UV_OFFLINE: '1'
        run: uv run python scripts/check_wheel.py
